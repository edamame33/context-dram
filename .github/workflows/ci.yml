name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # ruff pinned so an upstream release can't turn a green repo red
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.9"
      - name: unittest
        run: python -m unittest discover -p "test_*.py" -v
